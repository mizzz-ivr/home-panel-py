<section class="card dashboard-card" data-swapy-item="{{ card.card_id }}">
  <div class="card-heading">
    <h2>{{ card.title }}</h2>
    <button
      type="button"
      class="drag-handle"
      data-swapy-handle
      aria-label="{{ card.title }}カードを並び替え"
      title="ドラッグして並び替え"
    >
      <span aria-hidden="true">⠿</span>
      <span>並び替え</span>
    </button>
  </div>
  <form action="/memo/today" method="post">
    <p class="hint">空で保存すると当日のメモをクリアできます。</p>
    <textarea name="content" rows="6" maxlength="5000" placeholder="今日のメモを記録">{{ memo_content }}</textarea>
    <button type="submit">保存</button>
  </form>
</section>
